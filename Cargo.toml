[package]
name = "yubi"
version = "0.1.0"
edition = "2021"
description = "A TUI typing trainer that tracks per-finger accuracy over time."

[[bin]]
name = "yubi"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rand = "0.8"
chrono = "0.4"

[profile.release]
opt-level = 3
